# REST fallback for users who do not install the custom integration.
# Replace ANALYZER_IP with the LAN address of the computer running app.py.
rest:
  - resource: "http://ANALYZER_IP:8765/api/ha"
    scan_interval: 180
    timeout: 10
    sensor:
      - name: "SolarMax PV Power"
        unique_id: solarmax_pv_power
        value_template: "{{ value_json.sensors.pv_power.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "SolarMax Grid Power"
        unique_id: solarmax_grid_power
        value_template: "{{ value_json.sensors.grid_power.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "SolarMax Battery Power"
        unique_id: solarmax_battery_power
        value_template: "{{ value_json.sensors.battery_power.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "SolarMax Battery SOC"
        unique_id: solarmax_battery_soc
        value_template: "{{ value_json.sensors.battery_soc.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: "SolarMax Backup Load Power"
        unique_id: solarmax_backup_load_power
        value_template: "{{ value_json.sensors.backup_power.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "SolarMax GEN Smart Load Power"
        unique_id: solarmax_gen_smart_load_power
        value_template: "{{ value_json.sensors.gen_port_power.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "SolarMax Normal Load Power"
        unique_id: solarmax_normal_load_power
        value_template: "{{ value_json.sensors.load_power.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "SolarMax Grid Voltage"
        unique_id: solarmax_grid_voltage
        value_template: "{{ value_json.sensors.grid_voltage.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
      - name: "SolarMax Grid Frequency"
        unique_id: solarmax_grid_frequency
        value_template: "{{ value_json.sensors.grid_frequency.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
      - name: "SolarMax Inverter Temperature"
        unique_id: solarmax_inverter_temperature
        value_template: "{{ value_json.sensors.temperature.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "SolarMax Generated Energy Total"
        unique_id: solarmax_generated_energy_total
        value_template: "{{ value_json.sensors.total_energy.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "SolarMax Grid Imported Energy Total"
        unique_id: solarmax_grid_imported_energy_total
        value_template: "{{ value_json.sensors.grid_import_total.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "SolarMax Grid Exported Energy Total"
        unique_id: solarmax_grid_exported_energy_total
        value_template: "{{ value_json.sensors.grid_export_total.value }}"
        availability: "{{ value_json.available }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
